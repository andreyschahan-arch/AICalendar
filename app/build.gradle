plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aicalendar'
    compileSdk 34

    defaultConfig {
        applicationId "com.aicalendar"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "4.1 PRO"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
